# ATC Recorder Docker Compose Configuration
#
# Usage:
#   docker compose up --build                              # Build and show help
#   docker compose run --rm atc-recorder feeds list kdca   # List feeds
#   docker compose run --rm atc-recorder record kdca1_gnd --duration 30m
#   docker compose up -d atc-daemon                        # Run daemon in background
#   docker compose logs -f atc-daemon                      # View daemon logs
#   docker compose --profile archive run --rm atc-archiver download kdca1_gnd --date 2026-02-01
#   docker compose --profile asr up -d                     # Start ASR transcription services
#   docker compose --profile asr-parakeet up -d            # Start Parakeet ASR workflow

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./recordings:/app/recordings
    - ./config.yaml:/app/config.yaml:ro
    - ./credentials.json:/app/credentials.json:ro
    - ./logs:/app/logs
  environment:
    - TZ=${TZ:-UTC}
    - ATC_LOG_LEVEL=${ATC_LOG_LEVEL:-INFO}
    - NGC_API_KEY=${NGC_API_KEY:-}
  networks:
    - atc-network

services:
  # Main CLI service - for ad-hoc commands
  atc-recorder:
    <<: *common
    container_name: atc-recorder-cli
    stdin_open: true
    tty: true
    # Override command as needed, e.g.:
    # command: ["record", "kdca1_gnd", "--duration", "30m"]

  # Daemon service for continuous recording
  atc-daemon:
    <<: *common
    container_name: atc-recorder-daemon
    command: ["daemon", "--config", "/app/config.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "atc-recorder", "check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Archive downloader service - use with --profile archive
  atc-archiver:
    <<: *common
    container_name: atc-recorder-archiver
    profiles:
      - archive
    # Example usage:
    # docker compose --profile archive run --rm atc-archiver download kdca1_gnd --date 2026-02-01 --hours 24

  # Scheduled archive downloader (downloads previous day's archives daily)
  atc-archive-cron:
    <<: *common
    container_name: atc-recorder-archive-cron
    profiles:
      - cron
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Archive cron job started"
        while true; do
          # Calculate yesterday's date
          YESTERDAY=$$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          echo "$$(date): Downloading archives for $$YESTERDAY"
          
          # Download archives for each configured feed
          for feed in kdca1_gnd kdca2_twr kdca1_app_final kdca1_dep; do
            echo "Downloading $$feed for $$YESTERDAY"
            atc-recorder download $$feed --date $$YESTERDAY --hours 24 || true
            sleep 5
          done
          
          # Sleep until next day (run at 2 AM UTC)
          NEXT_RUN=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -v+1d -v2H -v0M -v0S +%s)
          NOW=$$(date +%s)
          SLEEP_TIME=$$((NEXT_RUN - NOW))
          echo "Next run in $$SLEEP_TIME seconds"
          sleep $$SLEEP_TIME
        done
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Web dashboard for visualizing recordings, transcripts, and search
  atc-dashboard:
    <<: *common
    container_name: atc-dashboard
    command: ["dashboard", "--config", "/app/config.yaml", "--port", "8050"]
    ports:
      - "8050:8050"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./recordings:/app/recordings
      - ./config.yaml:/app/config.yaml:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./logs:/app/logs
      - ${MAXINE_SDK_PATH:-../maxine-afx/Audio_Effects_SDK}:/opt/maxine:ro
    environment:
      - TZ=${TZ:-UTC}
      - ATC_LOG_LEVEL=${ATC_LOG_LEVEL:-INFO}
      - NGC_API_KEY=${NGC_API_KEY:-}
      - MAXINE_AUDIO_CLI=/opt/maxine/run_maxine.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # NVIDIA Whisper ASR service - use with --profile asr
  # Requires: NVIDIA GPU, Container Toolkit, and NGC_API_KEY
  # First run may take up to 30 minutes for model download
  whisper-asr:
    image: ${NIM_WHISPER_IMAGE:-nvcr.io/nim/nvidia/whisper-large-v3:latest}
    container_name: atc-whisper-asr
    profiles:
      - asr
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=${NIM_WHISPER_TAGS_SELECTOR:-name=whisper-large-v3}
    ports:
      - "9000:9000"
      - "50051:50051"
    networks:
      - atc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Transcription worker - watches recordings and transcribes new files
  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile.transcriber
    container_name: atc-transcription-worker
    profiles:
      - asr
    volumes:
      - ./recordings:/app/recordings
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    environment:
      - TZ=${TZ:-UTC}
      - ATC_LOG_LEVEL=${ATC_LOG_LEVEL:-INFO}
      - WHISPER_GRPC_HOST=whisper-asr
      - WHISPER_GRPC_PORT=50051
    networks:
      - atc-network
    depends_on:
      whisper-asr:
        condition: service_healthy
    command: ["transcribe-watch", "--config", "/app/config.yaml"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # NVIDIA Parakeet ASR service - use with --profile asr-parakeet
  # Runs in parallel with whisper-asr on different host ports.
  parakeet-asr:
    image: ${NIM_PARAKEET_IMAGE:-nvcr.io/nim/nvidia/parakeet-tdt-0.6b-v2:latest}
    container_name: atc-parakeet-asr
    profiles:
      - asr-parakeet
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=${NIM_PARAKEET_TAGS_SELECTOR:-name=parakeet-tdt-0.6b-v2}
    ports:
      - "${NIM_PARAKEET_HOST_HTTP_PORT:-9001}:9000"
      - "${NIM_PARAKEET_HOST_GRPC_PORT:-50052}:50051"
    networks:
      - atc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Parakeet transcription worker - same pipeline, different ASR backend
  parakeet-transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile.transcriber
    container_name: atc-parakeet-transcription-worker
    profiles:
      - asr-parakeet
    volumes:
      - ./recordings:/app/recordings
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    environment:
      - TZ=${TZ:-UTC}
      - ATC_LOG_LEVEL=${ATC_LOG_LEVEL:-INFO}
      - WHISPER_GRPC_HOST=parakeet-asr
      - WHISPER_GRPC_PORT=50051
    networks:
      - atc-network
    depends_on:
      parakeet-asr:
        condition: service_healthy
    command: ["transcribe-watch", "--config", "/app/config.yaml"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # NVIDIA NIM Retriever embedding service - use with --profile rag
  # Requires: NVIDIA GPU, Container Toolkit, and NGC_API_KEY
  embedding-nim:
    image: ${NIM_RETRIEVER_IMAGE:-nvcr.io/nim/nvidia/llama-3.2-nv-embedqa-1b-v2:latest}
    container_name: atc-embedding-nim
    profiles:
      - rag
      - retriever
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=${NIM_RETRIEVER_HTTP_PORT:-8000}
      - NIM_TAGS_SELECTOR=${NIM_RETRIEVER_TAGS_SELECTOR:-name=llama-3.2-nv-embedqa-1b-v2}
    ports:
      - "${NIM_RETRIEVER_HOST_PORT:-9080}:${NIM_RETRIEVER_HTTP_PORT:-8000}"
    networks:
      - atc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NIM_RETRIEVER_HTTP_PORT:-8000}/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Milvus dependencies - use with --profile rag
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: atc-milvus-etcd
    profiles:
      - rag
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd:/etcd
    networks:
      - atc-network

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: atc-milvus-minio
    profiles:
      - rag
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data
    volumes:
      - milvus-minio:/minio_data
    networks:
      - atc-network

  milvus-standalone:
    image: milvusdb/milvus:v2.4.13
    container_name: atc-milvus-standalone
    profiles:
      - rag
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    depends_on:
      - milvus-etcd
      - milvus-minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - atc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Search API service (semantic + time/channel filter)
  rag-api:
    <<: *common
    container_name: atc-rag-api
    profiles:
      - rag
    command: ["rag-api", "--config", "/app/config.yaml"]
    ports:
      - "8100:8100"
    depends_on:
      embedding-nim:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # NeMo LoRA fine-tuning service - use with --profile train
  # Requires: NVIDIA GPU (24GB+ VRAM recommended), NGC_API_KEY
  # Generate training config first: atc-recorder training configure
  nemo-training:
    build:
      context: .
      dockerfile: Dockerfile.nemo
    container_name: atc-nemo-training
    profiles:
      - train
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 16gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NEMO_TRAINING_CONFIG=/workspace/training/parakeet_lora.yaml
    volumes:
      - ./recordings:/workspace/recordings:ro
      - ./models:/workspace/output
      - ./models/lora_adapters:/workspace/training
      - ./config.yaml:/workspace/config.yaml:ro
    networks:
      - atc-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # LoRA-adapted Parakeet ASR inference - use with --profile asr-lora
  # Serves the fine-tuned Parakeet model with LoRA adapter
  parakeet-lora-asr:
    build:
      context: .
      dockerfile: Dockerfile.nemo
    container_name: atc-parakeet-lora-asr
    profiles:
      - asr-lora
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ./models:/workspace/models:ro
      - ./config.yaml:/workspace/config.yaml:ro
    ports:
      - "${NIM_LORA_HOST_GRPC_PORT:-50053}:50053"
    networks:
      - atc-network
    entrypoint: ["python", "-c"]
    command:
      - |
        import nemo.collections.asr as nemo_asr
        from concurrent import futures
        import grpc, json, wave, io, sys, os, numpy as np
        from pathlib import Path

        model_dir = Path('/workspace/models/lora_adapters')
        adapter_files = sorted(model_dir.glob('*.nemo'))
        if not adapter_files:
            print('No LoRA adapter .nemo files found in /workspace/models/lora_adapters/', flush=True)
            sys.exit(1)

        adapter_path = adapter_files[-1]
        print(f'Loading LoRA model from: {adapter_path}', flush=True)
        model = nemo_asr.models.ASRModel.restore_from(str(adapter_path))
        model.eval()
        print('Model loaded, ready for inference on port 50053', flush=True)

        # Simple HTTP inference server
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import tempfile

        class InferenceHandler(BaseHTTPRequestHandler):
            def do_POST(self):
                if self.path == '/transcribe':
                    length = int(self.headers.get('Content-Length', 0))
                    audio_data = self.rfile.read(length)
                    with tempfile.NamedTemporaryFile(suffix='.wav', delete=False) as f:
                        f.write(audio_data)
                        tmp_path = f.name
                    try:
                        transcription = model.transcribe([tmp_path])
                        text = transcription[0] if transcription else ''
                        resp = json.dumps({'text': text}).encode()
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.end_headers()
                        self.wfile.write(resp)
                    finally:
                        os.unlink(tmp_path)
                else:
                    self.send_response(404)
                    self.end_headers()

            def do_GET(self):
                if self.path == '/health':
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(b'{"status":"ready"}')
                else:
                    self.send_response(404)
                    self.end_headers()

            def log_message(self, format, *args):
                pass

        server = HTTPServer(('0.0.0.0', 50053), InferenceHandler)
        print('LoRA inference server listening on :50053', flush=True)
        server.serve_forever()
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50053/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  atc-network:
    driver: bridge

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
