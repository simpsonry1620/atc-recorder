name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test container
        run: docker compose build atc-recorder

      - name: Run lint and tests in container
        run: >
          docker compose run --rm --entrypoint sh
          -v "$GITHUB_WORKSPACE:/app"
          atc-recorder
          -lc "cd /app &&
          python -m pip install --no-cache-dir black ruff pytest pytest-cov &&
          python -m black --check src tests &&
          python -m ruff check src tests &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache"
