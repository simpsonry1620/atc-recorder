name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p recordings logs
          touch credentials.json

      - name: Build test container
        run: docker compose build atc-recorder

      - name: Black (format check)
        run: >
          docker compose run --rm --no-deps --entrypoint sh
          atc-recorder
          -lc "pip install --no-cache-dir -q black &&
          python -m black --check src tests"

      - name: Ruff (lint)
        run: >
          docker compose run --rm --no-deps --entrypoint sh
          atc-recorder
          -lc "pip install --no-cache-dir -q ruff &&
          python -m ruff check src tests"

      - name: Pytest
        run: >
          docker compose run --rm --no-deps --entrypoint sh
          atc-recorder
          -lc "pip install --no-cache-dir -q pytest pytest-cov &&
          python -m pytest -q -o cache_dir=/tmp/pytest-cache"
