# ATC Recorder Configuration

# Output directory for recordings
output_dir: ./recordings

# Duration of each recording segment in seconds (1800 = 30 minutes)
segment_duration: 1800

# Delay between HTTP requests in seconds (be respectful to servers)
request_delay: 1.0

# User agent string for HTTP requests
user_agent: ATC-Recorder/0.1.0

# List of feed IDs to record (for daemon mode)
# See available feeds with: atc-recorder feeds list kdca
feeds:
  - kdca1_gnd          # Ground (121.700)
  - kdca1_twr          # Tower (119.100) - kdca2_twr was offline
  - kdca1_app_final    # Approach DCA Final (124.700)
  - kdca1_dep          # Potomac Departure (118.950)

# Recording behavior settings
recording:
  # Enable/disable recording
  enabled: true
  
  # Delay before attempting to reconnect after a stream drops (seconds)
  reconnect_delay: 30
  
  # Maximum number of reconnection attempts before giving up
  max_retries: 5
  
  # Segment duration for live recording (should match top-level segment_duration)
  segment_duration: 1800

# Optional: web dashboard settings
# dashboard:
#   host: 0.0.0.0
#   port: 8050

# Transcription defaults (used by transcribe-watch and CLI commands)
transcription:
  preprocess: ffmpeg_vad      # none | ffmpeg | ffmpeg_vad | sox | maxine | pipeline
  preprocess_output_dir: ./recordings/preprocessed
  keep_preprocessed_audio: false
  segment_by_pauses: true     # segment by silence and timestamp each segment
  min_silence_duration: 0.5   # seconds of silence to detect a pause
  silence_threshold_dB: -30   # dB below which is considered silence
  min_speech_duration: 0.3    # drop speech intervals shorter than this
  merge_gap_seconds: 0.5      # merge speech intervals separated by shorter silence
  output_format: json         # json | timestamped-txt | srt
  diarization_enabled: false  # add role labels: ATC | PILOT | UNKNOWN
  diarization_mode: role-heuristic
  stitch_across_files: false  # stitch transmissions spanning adjacent files
  stitch_max_gap_seconds: 2.0
  stitch_min_text_overlap_chars: 12
  variant_store_path: ./recordings/transcripts.db
  # Pipeline presets (when preprocess: pipeline)
  # pipeline_preset: maxine-v2-vad   # use a named preset from the Workflow tab
  # Or define inline steps:
  # pipeline_steps:
  #   - step: maxine
  #     params:
  #       effect: denoiser
  #       effect_version: 2
  #       intensity_ratio: 1.0
  #       enable_vad: true
  #   - step: normalize
  #     params:
  #       peak: 0.9
  #       smoothing: 3

# RAG ingestion and semantic search configuration
rag:
  enabled: true
  ingest_on_transcribe: true
  embedding:
    provider: nvidia-nim
    endpoint: http://embedding-nim:8000/v1/embeddings
    model: nvidia/llama-3.2-nv-embedqa-1b-v2
    api_key_env: NGC_API_KEY
    timeout_seconds: 15
    max_retries: 3
    retry_backoff_seconds: 1.0
  vector_store:
    provider: milvus
    host: milvus-standalone
    port: 19530
    collection_name: atc_transcripts
    embedding_dim: 2048
    metric_type: COSINE
    index_type: HNSW
    sqlite_metadata_path: ./recordings/rag_metadata.db
  api:
    host: 0.0.0.0
    port: 8100
    top_k_default: 10
    top_k_max: 50

# Flight entity extraction
tracking:
  entity_extraction:
    enabled: true
    extract_callsigns: true
    extract_runways: true
    extract_altitudes: true
    extract_frequencies: true
    min_confidence: 0.5
